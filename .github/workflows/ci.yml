name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm test:scripts
      - run: pnpm exec supabase start
      - run: pnpm test:env
      - run: pnpm db:migrate
      - run: pnpm test:integration
      # Production build (web + bundled API + CSP from the embedded Supabase URL) must succeed too.
      - run: pnpm build:vercel
