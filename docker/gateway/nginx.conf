# Stands in for Supabase's Kong gateway for the one service we run: /auth/v1/* goes to Auth with the prefix stripped,
# so the browser, supabase-js and the test helpers use the same URLs as against hosted Supabase.
# Only the two local page origins may call Auth from a browser; any other origin gets no CORS headers.
map $http_origin $cors_origin {
  "http://localhost:5173" $http_origin;
  "http://localhost:3000" $http_origin;
  default "";
}

server {
  listen 8000;

  location /auth/v1/ {
    # Auth itself sends no CORS headers (on hosted Supabase, Kong adds them). The pages run on other origins
    # (localhost:5173 dev, localhost:3000 check), so answer preflights here and allow those origins on responses.
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
      add_header Access-Control-Max-Age 3600 always;
      return 204;
    }
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    return 404;
  }
}
